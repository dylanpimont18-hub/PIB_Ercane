<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="cloison-title" class="scene scene--cloison">
  <title id="cloison-title">Vue en plan d'une cloison sur ossature métallique : rails, montants, laine et plaques de plâtre des deux côtés</title>

  <defs>
    <pattern id="fibres-c" x="36" y="235" width="24" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 Q6 2 12 8 T24 8" fill="none" stroke="#D9B142" stroke-width="1.4" opacity="0.7"/>
      <path d="M-6 14 Q0 8 6 14 T18 14" fill="none" stroke="#F3D877" stroke-width="1.2" opacity="0.7"/>
    </pattern>
    <pattern id="beton-c" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#9E9B95" stroke-width="1.2" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- ===== Décor fixe : la pièce vue de dessus ===== -->
  <g class="scene__decor">
    <rect class="mat-interieur" x="0" y="0" width="720" height="500"/>
    <rect class="mat-beton" x="0" y="0" width="720" height="30"/>
    <rect x="0" y="0" width="720" height="30" fill="url(#beton-c)"/>
    <rect class="mat-beton" x="0" y="470" width="720" height="30"/>
    <rect x="0" y="470" width="720" height="30" fill="url(#beton-c)"/>
    <rect class="mat-beton" x="0" y="30" width="30" height="440"/>
    <rect x="0" y="30" width="30" height="440" fill="url(#beton-c)"/>
    <rect class="mat-beton" x="690" y="30" width="30" height="440"/>
    <rect x="690" y="30" width="30" height="440" fill="url(#beton-c)"/>

    <g class="scene__cote"><text x="44" y="54">Vue de dessus (plan)</text></g>
    <text class="scene__label" x="360" y="130" text-anchor="middle">Pièce 1</text>
    <text class="scene__label" x="360" y="350" text-anchor="middle">Pièce 2</text>
  </g>

  <!-- ===== Étape 1 : tracé au sol ===== -->
  <g class="layer layer--trace">
    <line data-in="1" class="scene__trace anim-from-left" x1="30" y1="250" x2="690" y2="250"/>
  </g>

  <!-- ===== Étape 2 : rail (au sol, et le même au plafond) ===== -->
  <g class="layer layer--rails">
    <g data-in="2" class="anim-drop">
      <rect class="mat-metal" x="30" y="230" width="660" height="40"/>
      <line class="mat-metal-line" x1="30" y1="235" x2="690" y2="235"/>
      <line class="mat-metal-line" x1="30" y1="265" x2="690" y2="265"/>
    </g>
  </g>

  <!-- ===== Étape 4 : laine entre les montants (derrière les montants) ===== -->
  <g class="layer layer--laine">
    <g data-in="4" class="anim-drop">
      <rect class="mat-laine" x="36" y="235" width="648" height="30"/>
      <rect x="36" y="235" width="648" height="30" fill="url(#fibres-c)"/>
    </g>
  </g>

  <!-- ===== Étape 3 : montants tous les 60 cm (profil en C vu de dessus) ===== -->
  <g class="layer layer--montants" fill="none" stroke="#9AA0A6" stroke-width="5" stroke-linejoin="round">
    <path data-in="3" class="anim-pop" d="M74 234 H54 V266 H74"/>
    <path data-in="3" class="anim-pop" d="M174 234 H154 V266 H174"/>
    <path data-in="3" class="anim-pop" d="M274 234 H254 V266 H274"/>
    <path data-in="3" class="anim-pop" d="M374 234 H354 V266 H374"/>
    <path data-in="3" class="anim-pop" d="M474 234 H454 V266 H474"/>
    <path data-in="3" class="anim-pop" d="M574 234 H554 V266 H574"/>
    <path data-in="3" class="anim-pop" d="M646 234 H666 V266 H646"/>
  </g>
  <g class="layer layer--cote">
    <g data-in="3" class="anim-fade scene__cote">
      <line x1="154" y1="290" x2="254" y2="290"/>
      <line x1="154" y1="286" x2="154" y2="294"/>
      <line x1="254" y1="286" x2="254" y2="294"/>
      <text x="204" y="308" text-anchor="middle">60 cm</text>
    </g>
  </g>

  <!-- ===== Étape 5 : placo face 1 (côté pièce 1) ===== -->
  <g class="layer layer--face1">
    <rect data-in="5" class="mat-placo anim-drop" x="30" y="216" width="660" height="14"/>
  </g>

  <!-- ===== Étape 6 : placo face 2 (côté pièce 2) : le coffre se ferme ===== -->
  <g class="layer layer--face2">
    <rect data-in="6" class="mat-placo anim-rise" x="30" y="270" width="660" height="14"/>
  </g>

  <!-- ===== Étape 7 : enduit des deux côtés ===== -->
  <g class="layer layer--enduit">
    <rect data-in="7" class="mat-enduit anim-grow-right" x="30" y="212" width="660" height="4"/>
    <rect data-in="7" class="mat-enduit anim-grow-right" x="30" y="284" width="660" height="4"/>
  </g>

  <!-- ===== Étape 8 : peinture ===== -->
  <g class="layer layer--peinture">
    <rect data-in="8" class="mat-peinture anim-grow-right" x="30" y="208" width="660" height="4"/>
    <rect data-in="8" class="mat-peinture anim-grow-right" x="30" y="288" width="660" height="4"/>
  </g>

  <!-- ===== Indicateur d'isolation acoustique ===== -->
  <g class="gauge gauge--acoustic" aria-hidden="true">
    <text class="gauge__title" x="360" y="412" text-anchor="middle">Bruit atténué entre les deux pièces</text>
    <rect class="gauge__tube" x="160" y="424" width="400" height="16" rx="8"/>
    <rect class="gauge__fill gauge__fill--x" x="163" y="427" width="394" height="10" rx="5"/>
    <text class="gauge__value" x="360" y="464" text-anchor="middle" data-gauge-text="true">0 dB</text>
  </g>
</svg>
