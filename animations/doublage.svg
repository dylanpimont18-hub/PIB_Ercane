<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="doublage-title" class="scene scene--doublage">
  <title id="doublage-title">Coupe d'un mur en parpaings doublé : ossature métallique, laine de verre, pare-vapeur, plaques de plâtre</title>

  <defs>
    <!-- Fibres de la laine de verre -->
    <pattern id="fibres" width="24" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 Q6 2 12 8 T24 8" fill="none" stroke="#D9B142" stroke-width="1.4" opacity="0.7"/>
      <path d="M-6 14 Q0 8 6 14 T18 14" fill="none" stroke="#F3D877" stroke-width="1.2" opacity="0.7"/>
    </pattern>
    <!-- Hachures du béton -->
    <pattern id="beton" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#9E9B95" stroke-width="1.2" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- ===== Décor fixe (étape 0) ===== -->
  <g class="scene__decor">
    <rect class="mat-exterieur" x="0" y="0" width="90" height="440"/>
    <rect class="mat-interieur" x="400" y="0" width="320" height="440"/>

    <!-- Dalle haute et dalle basse -->
    <rect class="mat-beton" x="90" y="30" width="510" height="34"/>
    <rect x="90" y="30" width="510" height="34" fill="url(#beton)"/>
    <rect class="mat-beton" x="0" y="436" width="720" height="44"/>
    <rect x="0" y="436" width="720" height="44" fill="url(#beton)"/>

    <text class="scene__label" x="45" y="112" text-anchor="middle">Extérieur</text>
    <text class="scene__label scene__label--cold" x="45" y="138" text-anchor="middle">5 °C</text>
    <text class="scene__label" x="500" y="112" text-anchor="middle">Intérieur</text>
  </g>

  <!-- ===== Étape 1 : parpaings, rangée par rangée (de bas en haut) ===== -->
  <g class="layer layer--parpaings">
    <g data-in="1" class="anim-drop"><rect class="mat-parpaing" x="90" y="390" width="160" height="45"/><rect class="mat-parpaing-cell" x="110" y="398" width="50" height="29"/><rect class="mat-parpaing-cell" x="180" y="398" width="50" height="29"/></g>
    <g data-in="1" class="anim-drop"><rect class="mat-parpaing" x="90" y="343" width="160" height="45"/><rect class="mat-parpaing-cell" x="110" y="351" width="50" height="29"/><rect class="mat-parpaing-cell" x="180" y="351" width="50" height="29"/></g>
    <g data-in="1" class="anim-drop"><rect class="mat-parpaing" x="90" y="296" width="160" height="45"/><rect class="mat-parpaing-cell" x="110" y="304" width="50" height="29"/><rect class="mat-parpaing-cell" x="180" y="304" width="50" height="29"/></g>
    <g data-in="1" class="anim-drop"><rect class="mat-parpaing" x="90" y="249" width="160" height="45"/><rect class="mat-parpaing-cell" x="110" y="257" width="50" height="29"/><rect class="mat-parpaing-cell" x="180" y="257" width="50" height="29"/></g>
    <g data-in="1" class="anim-drop"><rect class="mat-parpaing" x="90" y="202" width="160" height="45"/><rect class="mat-parpaing-cell" x="110" y="210" width="50" height="29"/><rect class="mat-parpaing-cell" x="180" y="210" width="50" height="29"/></g>
    <g data-in="1" class="anim-drop"><rect class="mat-parpaing" x="90" y="155" width="160" height="45"/><rect class="mat-parpaing-cell" x="110" y="163" width="50" height="29"/><rect class="mat-parpaing-cell" x="180" y="163" width="50" height="29"/></g>
    <g data-in="1" class="anim-drop"><rect class="mat-parpaing" x="90" y="108" width="160" height="45"/><rect class="mat-parpaing-cell" x="110" y="116" width="50" height="29"/><rect class="mat-parpaing-cell" x="180" y="116" width="50" height="29"/></g>
    <g data-in="1" class="anim-drop"><rect class="mat-parpaing" x="90" y="64" width="160" height="42"/><rect class="mat-parpaing-cell" x="110" y="71" width="50" height="28"/><rect class="mat-parpaing-cell" x="180" y="71" width="50" height="28"/></g>
  </g>

  <!-- ===== Étape 4 : laine de verre (dessinée avant l'ossature pour passer derrière) ===== -->
  <g class="layer layer--laine">
    <g data-in="4" class="anim-from-right">
      <rect class="mat-laine" x="250" y="64" width="100" height="372"/>
      <rect x="250" y="64" width="100" height="372" fill="url(#fibres)"/>
    </g>
  </g>

  <!-- ===== Étape 2 : rails bas et haut ===== -->
  <g class="layer layer--rails">
    <g data-in="2" class="anim-drop">
      <rect class="mat-metal" x="300" y="430" width="40" height="6"/>
      <rect class="mat-metal" x="300" y="414" width="5" height="22"/>
      <rect class="mat-metal" x="335" y="414" width="5" height="22"/>
    </g>
    <g data-in="2" class="anim-rise">
      <rect class="mat-metal" x="300" y="64" width="40" height="6"/>
      <rect class="mat-metal" x="300" y="64" width="5" height="22"/>
      <rect class="mat-metal" x="335" y="64" width="5" height="22"/>
    </g>
  </g>

  <!-- ===== Étape 3 : montant (un tous les 60 cm) ===== -->
  <g class="layer layer--montants">
    <g data-in="3" class="anim-grow-up">
      <rect class="mat-metal" x="306" y="70" width="28" height="360"/>
      <line class="mat-metal-line" x1="311" y1="70" x2="311" y2="430"/>
      <line class="mat-metal-line" x1="329" y1="70" x2="329" y2="430"/>
    </g>
    <!-- Cote « 60 cm » -->
    <g data-in="3" class="anim-fade scene__cote">
      <line x1="320" y1="20" x2="320" y2="26"/>
      <text x="320" y="16" text-anchor="middle">un montant tous les 60 cm</text>
    </g>
  </g>

  <!-- ===== Étape 5 : pare-vapeur côté pièce ===== -->
  <g class="layer layer--pare-vapeur">
    <g data-in="5" class="anim-unroll">
      <rect class="mat-pare-vapeur" x="350" y="64" width="8" height="372"/>
    </g>
  </g>

  <!-- ===== Étape 6 : plaques de plâtre + vis ===== -->
  <g class="layer layer--placo">
    <g data-in="6" class="anim-from-right">
      <rect class="mat-placo" x="358" y="64" width="30" height="184"/>
    </g>
    <g data-in="6" class="anim-from-right">
      <rect class="mat-placo" x="358" y="252" width="30" height="184"/>
    </g>
    <g class="layer--vis">
      <circle data-in="6" class="mat-vis anim-pop" cx="373" cy="96" r="3.5"/>
      <circle data-in="6" class="mat-vis anim-pop" cx="373" cy="150" r="3.5"/>
      <circle data-in="6" class="mat-vis anim-pop" cx="373" cy="204" r="3.5"/>
      <circle data-in="6" class="mat-vis anim-pop" cx="373" cy="296" r="3.5"/>
      <circle data-in="6" class="mat-vis anim-pop" cx="373" cy="350" r="3.5"/>
      <circle data-in="6" class="mat-vis anim-pop" cx="373" cy="404" r="3.5"/>
    </g>
  </g>

  <!-- ===== Étape 7 : bande sur le joint puis enduit ===== -->
  <g class="layer layer--finitions">
    <rect data-in="7" class="mat-bande anim-pop" x="384" y="234" width="6" height="32" rx="1"/>
    <rect data-in="7" class="mat-enduit anim-grow-down" x="388" y="64" width="6" height="372"/>
  </g>

  <!-- ===== Étape 8 : peinture ===== -->
  <g class="layer layer--peinture">
    <rect data-in="8" class="mat-peinture anim-grow-down" x="394" y="64" width="6" height="372"/>
  </g>

  <!-- ===== Thermomètre ===== -->
  <g class="gauge gauge--thermo" aria-hidden="true">
    <text class="gauge__title" x="660" y="96" text-anchor="middle">Intérieur</text>
    <text class="gauge__value" x="660" y="122" text-anchor="middle" data-gauge-text="true">5 °C</text>
    <rect class="gauge__tube" x="650" y="138" width="20" height="256" rx="10"/>
    <rect class="gauge__fill" x="655" y="143" width="10" height="246" rx="5"/>
    <circle class="gauge__bulb" cx="660" cy="408" r="17"/>
    <!-- Repère extérieur (5 °C sur une échelle de 0 à 25) -->
    <line class="gauge__mark" x1="634" y1="340" x2="646" y2="340"/>
    <text class="gauge__mark-label" x="629" y="344" text-anchor="end">ext.</text>
  </g>
</svg>
